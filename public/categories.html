<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorias | Pawfect Paradise</title>
<meta name="description" content="Explore todas as categorias de produtos para pets da Pawfect Paradise.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-emoji">🐾</span>
      <span class="logo-text"><strong>Pawfect <span class="brand-pink">Paradise</span></strong><small>cute stuff for cute pets</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html" class="active">Categories</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html" id="link-admin" style="display:none;">Admin</a>
    </nav>
    <div class="header-icons">
      <a href="shop.html" class="icon-btn" title="Pesquisar">🔍</a>
      <a href="login.html" class="icon-btn" id="link-usuario" title="Entrar">👤</a>
      <a href="carrinho.html" class="icon-btn">🛒<span class="cart-count">0</span></a>
      <button class="menu-toggle" aria-label="Abrir menu">☰</button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <h1>Categorias</h1>
    <p class="breadcrumb">Home / Categories</p>
  </div>
</div>

<main class="container secao" style="padding-top:0;">
  <div class="categorias-grid" id="lista-categorias"></div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">&copy; 2026 Pawfect Paradise. Todos os direitos reservados. Projeto acadêmico. Grupo: Jessica Hellen, Maria Leticia e Sarah Rebeca.</div>
</footer>

<script src="js/app.js"></script>
<script>
async function carregar() {
  const categorias = await get('/categorias');
  document.querySelector('#lista-categorias').innerHTML = categorias.map((c) => `
    <a class="categoria-card" href="shop.html?categoria_id=${c.id}">
      <img class="categoria-img" src="${c.imagem}" alt="Categoria ${c.nome}">
      <span>${c.nome}</span>
    </a>
  `).join('');
}
carregar();
</script>
</body>
</html>
