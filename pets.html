<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Pets | Pawfect Paradise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-emoji">🐾</span>
      <span class="logo-text"><strong>Pawfect <span class="brand-pink">Paradise</span></strong><small>cute stuff for cute pets</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html" id="link-admin" style="display:none;">Admin</a>
    </nav>
    <div class="header-icons">
      <a href="shop.html" class="icon-btn" title="Search">🔍</a>
      <a href="perfil.html" class="icon-btn" id="link-usuario" title="Profile">👤</a>
      <a href="carrinho.html" class="icon-btn">🛒<span class="cart-count">0</span></a>
      <button class="menu-toggle" aria-label="Open menu">☰</button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <h1>My Pets</h1>
    <p class="breadcrumb">Home / My Pets</p>
  </div>
</div>

<main class="container secao" style="padding-top:0;">
  <div class="mensagem" id="mensagem"></div>
  <div style="text-align:right; margin-bottom:20px;">
    <button class="btn btn-primary" id="btn-novo-pet">+ Add Pet</button>
  </div>

  <div id="lista-pets"></div>
</main>

<!-- MODAL DE CADASTRO/EDIÇÃO -->
<div class="modal-overlay" id="modal-pet">
  <div class="modal-box">
    <h3 id="modal-titulo">Add Pet</h3>
    <form id="form-pet">
      <input type="hidden" id="pet-id">
      <div class="campo">
        <label for="pet-nome">Name <span class="obrigatorio">*</span></label>
        <input type="text" id="pet-nome" required>
      </div>
      <div class="campo">
        <label for="pet-especie">Species <span class="obrigatorio">*</span></label>
        <select id="pet-especie" required>
          <option value="Dog">Dog</option>
          <option value="Cat">Cat</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="campo">
        <label for="pet-raca">Breed</label>
        <input type="text" id="pet-raca">
      </div>
      <div class="campo">
        <label for="pet-idade">Age (years)</label>
        <input type="number" id="pet-idade" min="0">
      </div>
      <div class="campo">
        <label for="pet-sexo">Sex</label>
        <select id="pet-sexo">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div class="campo">
        <label for="pet-peso">Weight (kg)</label>
        <input type="number" id="pet-peso" step="0.1" min="0">
      </div>
      <div class="campo">
        <label for="pet-foto">Photo URL</label>
        <input type="text" id="pet-foto" placeholder="https://...">
      </div>
      <div class="campo">
        <label for="pet-obs">Notes</label>
        <textarea id="pet-obs" placeholder="Allergies, special care, etc."></textarea>
      </div>
      <div class="modal-acoes">
        <button type="button" class="btn btn-secondary" id="btn-cancelar-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container footer-bottom">&copy; 2026 Pawfect Paradise. All rights reserved. Academic project by Pawfect Dev Team.</div>
</footer>

<script src="app.js"></script>
<script>
async function carregarPets() {
  const usuario = await exigirLoginOuRedirecionar();
  if (!usuario) return;

  const pets = await get('/pets');
  const container = document.querySelector('#lista-pets');
  if (pets.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="emoji">🐶</div><p>You have not added any pets yet.</p></div>`;
    return;
  }
  container.innerHTML = pets.map((p) => `
    <div class="card-lista">
      <img src="${p.foto || 'https://placedog.net/100/100?id=' + p.id}" alt="${p.nome}" style="width:60px;height:60px;object-fit:cover;border-radius:50%;">
      <div style="flex:1; min-width:180px;">
        <strong>${p.nome}</strong> — ${p.especie}${p.raca ? ', ' + p.raca : ''}
        <br><small>${p.idade ? p.idade + ' anos · ' : ''}${p.sexo || ''}${p.peso ? ' · ' + p.peso + ' kg' : ''}</small>
        ${p.observacoes ? `<br><small style="color:var(--texto-medio);">${p.observacoes}</small>` : ''}
      </div>
      <div class="acoes-tabela">
        <button class="btn-secondary" onclick='abrirModalEdicao(${JSON.stringify(p)})'>Edit</button>
        <button class="btn-danger" onclick="excluirPet(${p.id})">Delete</button>
      </div>
    </div>
  `).join('');
}

function abrirModal() {
  document.querySelector('#modal-pet').classList.add('aberto');
}
function fecharModal() {
  document.querySelector('#modal-pet').classList.remove('aberto');
  document.querySelector('#form-pet').reset();
  document.querySelector('#pet-id').value = '';
  document.querySelector('#modal-titulo').textContent = 'Add Pet';
}

function abrirModalEdicao(pet) {
  document.querySelector('#modal-titulo').textContent = 'Edit Pet';
  document.querySelector('#pet-id').value = pet.id;
  document.querySelector('#pet-nome').value = pet.nome;
  document.querySelector('#pet-especie').value = pet.especie;
  document.querySelector('#pet-raca').value = pet.raca || '';
  document.querySelector('#pet-idade').value = pet.idade || '';
  document.querySelector('#pet-sexo').value = pet.sexo || 'Macho';
  document.querySelector('#pet-peso').value = pet.peso || '';
  document.querySelector('#pet-foto').value = pet.foto || '';
  document.querySelector('#pet-obs').value = pet.observacoes || '';
  abrirModal();
}

document.querySelector('#btn-novo-pet').addEventListener('click', abrirModal);
document.querySelector('#btn-cancelar-modal').addEventListener('click', fecharModal);

document.querySelector('#form-pet').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.querySelector('#mensagem');
  const id = document.querySelector('#pet-id').value;
  const corpo = {
    nome: document.querySelector('#pet-nome').value,
    especie: document.querySelector('#pet-especie').value,
    raca: document.querySelector('#pet-raca').value,
    idade: document.querySelector('#pet-idade').value || null,
    sexo: document.querySelector('#pet-sexo').value,
    peso: document.querySelector('#pet-peso').value || null,
    foto: document.querySelector('#pet-foto').value,
    observacoes: document.querySelector('#pet-obs').value,
  };

  try {
    if (id) {
      await put('/pets/' + id, corpo);
      mostrarMensagem(msg, 'Pet updated successfully!', 'sucesso');
    } else {
      await post('/pets', corpo);
      mostrarMensagem(msg, 'Pet added successfully!', 'sucesso');
    }
    fecharModal();
    carregarPets();
  } catch (err) {
    mostrarMensagem(msg, err.message, 'erro');
  }
});

async function excluirPet(id) {
  if (!confirm('Are you sure you want to delete this pet?')) return;
  const msg = document.querySelector('#mensagem');
  try {
    await del('/pets/' + id);
    mostrarMensagem(msg, 'Pet deleted successfully!', 'sucesso');
    carregarPets();
  } catch (err) {
    mostrarMensagem(msg, err.message, 'erro');
  }
}

carregarPets();
</script>
</body>
</html>
