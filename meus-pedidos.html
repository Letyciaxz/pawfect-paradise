<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Pawfect Paradise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-emoji">🐾</span>
      <span class="logo-text"><strong>Pawfect <span class="brand-pink">Paradise</span></strong><small>cute stuff for cute pets</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html" id="link-admin" style="display:none;">Admin</a>
    </nav>
    <div class="header-icons">
      <a href="shop.html" class="icon-btn" title="Search">🔍</a>
      <a href="perfil.html" class="icon-btn" id="link-usuario" title="Profile">👤</a>
      <a href="carrinho.html" class="icon-btn">🛒<span class="cart-count">0</span></a>
      <button class="menu-toggle" aria-label="Open menu">☰</button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <h1>My Orders</h1>
    <p class="breadcrumb">Home / My Orders</p>
  </div>
</div>

<main class="container secao" style="padding-top:0;">
  <div id="lista-pedidos"></div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">&copy; 2026 Pawfect Paradise. All rights reserved. Academic project by Pawfect Dev Team.</div>
</footer>

<script src="app.js"></script>
<script>
function classeBadge(status) {
  return 'badge badge-' + String(status || 'pending').toLowerCase().replace(/\s+/g, '');
}

async function carregar() {
  let pedidos = JSON.parse(localStorage.getItem('pawfect_pedidos') || '[]');
  const container = document.querySelector('#lista-pedidos');

  if (pedidos.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="emoji">📦</div><p>You don't have any orders yet.</p><a href="shop.html" class="btn btn-primary" style="margin-top:12px;">Start Shopping</a></div>`;
    return;
  }

  container.innerHTML = pedidos.map((p) => {
    const itens = Array.isArray(p.itens) ? p.itens : [];
    const total = Number(p.valor_total ?? p.total ?? itens.reduce((sum, item) => sum + (Number(item.preco || 0) * Number(item.quantidade || 0)), 0));
    return `
      <div class="card-lista" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
          <strong>Order #${p.id}</strong>
          <span class="${classeBadge(p.status)}">${p.status || 'Pending'}</span>
        </div>
        <small style="color:var(--texto-medio);">${new Date(p.data).toLocaleString('en-US')}</small>
        <div style="margin:10px 0;">
          ${itens.map((item) => `
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
              <img src="${item.produto_imagem}" alt="${item.produto_nome}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;">
              <span>${item.quantidade}x ${item.produto_nome}</span>
              <span style="margin-left:auto;">${formatarPreco(Number(item.preco || 0) * Number(item.quantidade || 0))}</span>
            </div>
          `).join('')}
        </div>
        <div style="text-align:right; font-weight:700;">Total: ${formatarPreco(total)}</div>
      </div>
    `;
  }).join('');
}
carregar();
</script>
</body>
</html>
