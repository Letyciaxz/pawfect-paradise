<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-pagina">Product | Pawfect Paradise</title>
<meta name="description" id="meta-descricao" content="Product details at Pawfect Paradise.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-emoji">🐾</span>
      <span class="logo-text"><strong>Pawfect <span class="brand-pink">Paradise</span></strong><small>cute stuff for cute pets</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html" id="link-admin" style="display:none;">Admin</a>
    </nav>
    <div class="header-icons">
      <a href="shop.html" class="icon-btn" title="Search">🔍</a>
      <a href="perfil.html" class="icon-btn" id="link-usuario" title="Profile">👤</a>
      <a href="carrinho.html" class="icon-btn">🛒<span class="cart-count">0</span></a>
      <button class="menu-toggle" aria-label="Open menu">☰</button>
    </div>
  </div>
</header>

<main class="container secao" id="conteudo-produto">
  <p>Loading product...</p>
</main>

<section class="container secao" style="padding-top:0;">
  <div class="secao-titulo">
    <h2>💬 Reviews</h2>
  </div>
  <div id="lista-avaliacoes" class="avaliacoes-grid"></div>

  <div class="form-card" id="form-avaliacao-card" style="display:none;">
    <h2>Leave your review</h2>
    <div class="mensagem" id="msg-avaliacao"></div>
    <form id="form-avaliacao">
      <div class="campo">
        <label>Your rating</label>
        <div class="estrela-input" id="estrela-input">
          <span data-valor="1">★</span><span data-valor="2">★</span><span data-valor="3">★</span><span data-valor="4">★</span><span data-valor="5">★</span>
        </div>
        <input type="hidden" id="nota-selecionada" value="0">
      </div>
      <div class="campo">
        <label for="comentario">Comment</label>
        <textarea id="comentario" placeholder="Tell us about your pet's experience with this product"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send review</button>
    </form>
  </div>
  <p id="aviso-login-avaliacao" style="text-align:center;">Share your experience with this product below.</p>
</section>

<footer class="site-footer">
  <div class="container footer-bottom">&copy; 2026 Pawfect Paradise. All rights reserved. Academic project by Pawfect Dev Team.</div>
</footer>

<script src="app.js"></script>
<script>
const idProduto = new URLSearchParams(window.location.search).get('id');
let notaSelecionada = 0;

async function carregarProduto() {
  if (!idProduto) {
    document.querySelector('#conteudo-produto').innerHTML = '<p>Product not specified.</p>';
    return;
  }
  try {
    const p = await get('/produtos/' + idProduto);
    document.querySelector('#titulo-pagina').textContent = `${p.nome} | Pawfect Paradise`;
    document.querySelector('#meta-descricao').setAttribute('content', p.descricao || '');

    document.querySelector('#conteudo-produto').innerHTML = `
      <p class="breadcrumb">Home / Shop / ${p.nome}</p>
      <div style="display:flex; gap:40px; flex-wrap:wrap; margin-top:20px;">
        <div style="flex:1; min-width:280px;">
          <img src="${p.imagem}" alt="${p.nome}" style="border-radius:24px; width:100%; object-fit:cover; max-height:420px;">
        </div>
        <div style="flex:1; min-width:280px;">
          <span class="produto-categoria">${p.categoria_nome || ''}</span>
          <h1>${p.nome}</h1>
          <p>${p.descricao || ''}</p>
          <h2 style="color:var(--rosa-principal); margin: 16px 0;">${formatarPreco(p.preco)}</h2>
          <p><small>${p.estoque > 0 ? `✅ ${p.estoque} in stock` : '❌ Out of stock'}</small></p>
          <div style="display:flex; align-items:center; gap:16px; margin: 20px 0;">
            <div class="qtd-control">
              <button id="btn-menos">-</button>
              <span id="qtd-produto">1</span>
              <button id="btn-mais">+</button>
            </div>
            <button class="btn btn-primary" id="btn-add-carrinho" ${p.estoque <= 0 ? 'disabled' : ''}>🛒 Add to cart</button>
          </div>
        </div>
      </div>
    `;

    let qtd = 1;
    document.querySelector('#btn-mais').addEventListener('click', () => { qtd++; document.querySelector('#qtd-produto').textContent = qtd; });
    document.querySelector('#btn-menos').addEventListener('click', () => { qtd = Math.max(1, qtd - 1); document.querySelector('#qtd-produto').textContent = qtd; });
    document.querySelector('#btn-add-carrinho').addEventListener('click', (e) => {
      adicionarAoCarrinho(p.id, qtd);
      e.target.textContent = 'Added to cart! ✓';
    });

    renderAvaliacoes(p.avaliacoes);
  } catch (err) {
    document.querySelector('#conteudo-produto').innerHTML = '<p>Product not found.</p>';
  }
}

function renderAvaliacoes(avaliacoes) {
  const container = document.querySelector('#lista-avaliacoes');
  if (!avaliacoes || avaliacoes.length === 0) {
    container.innerHTML = '<p style="grid-column:1/-1; text-align:center;">This product has no reviews yet. Be the first!</p>';
    return;
  }
  container.innerHTML = avaliacoes.map((a) => `
    <div class="avaliacao-card">
      ${renderEstrelas(a.nota)}
      <p>"${a.comentario || ''}"</p>
      <div class="avaliacao-autor">
        <img src="https://i.pravatar.cc/80?u=${a.usuario_id}" alt="${a.usuario_nome}">
        <strong>${a.usuario_nome}</strong>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('#estrela-input span').forEach((estrela) => {
  estrela.addEventListener('click', () => {
    notaSelecionada = Number(estrela.dataset.valor);
    document.querySelector('#nota-selecionada').value = notaSelecionada;
    document.querySelectorAll('#estrela-input span').forEach((e) => {
      e.classList.toggle('ativa', Number(e.dataset.valor) <= notaSelecionada);
    });
  });
});

document.querySelector('#form-avaliacao').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.querySelector('#msg-avaliacao');
  if (notaSelecionada === 0) return mostrarMensagem(msg, 'Please select a rating from 1 to 5 stars.', 'erro');
  try {
    await post('/avaliacoes', {
      produto_id: Number(idProduto),
      nota: notaSelecionada,
      comentario: document.querySelector('#comentario').value,
    });
    mostrarMensagem(msg, 'Review submitted successfully!', 'sucesso');
    e.target.reset();
    notaSelecionada = 0;
    document.querySelectorAll('#estrela-input span').forEach((e2) => e2.classList.remove('ativa'));
    const p = await get('/produtos/' + idProduto);
    renderAvaliacoes(p.avaliacoes);
  } catch (err) {
    mostrarMensagem(msg, err.message, 'erro');
  }
});

async function checarLoginAvaliacao() {
  const { usuario } = await get('/usuarios/me');
  const ehGuest = !usuario;
  document.querySelector('#form-avaliacao-card').style.display = 'block';
  document.querySelector('#aviso-login-avaliacao').style.display = ehGuest ? 'block' : 'none';
}

carregarProduto();
checarLoginAvaliacao();
</script>
</body>
</html>
