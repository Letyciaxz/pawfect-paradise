<script src="app.js"></script>
<script>
function classeBadge(status) {
  return 'badge badge-' + status.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

async function carregar() {
  const usuario = await exigirLoginOuRedirecionar();
  if (!usuario) return;

  const agendamentos = await get('/agendamentos');
  const container = document.querySelector('#lista-agendamentos');
  if (agendamentos.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="emoji">📅</div><p>You do not have any appointments yet.</p></div>`;
    return;
  }

  container.innerHTML = agendamentos.map((a) => `
    <div class="card-lista">
      <div style="flex:1; min-width:200px;">
        <strong>${a.servico_nome}</strong> for <strong>${a.pet_nome}</strong>
        <br><small>${new Date(a.data + 'T00:00:00').toLocaleDateString('en-US')} at ${a.horario}</small>
      </div>
      <span class="${classeBadge(a.status)}">${a.status}</span>
      ${a.status === 'Scheduled' || a.status === 'Confirmed'
        ? `<button class="btn btn-danger btn-small" onclick="cancelar(${a.id})">Cancel</button>`
        : ''}
    </div>
  `).join('');
}

async function cancelar(id) {
  if (!confirm('Are you sure you want to cancel this appointment?')) return;
  const msg = document.querySelector('#mensagem');
  try {
    await put('/agendamentos/' + id, { status: 'Cancelled' });
    mostrarMensagem(msg, 'Appointment cancelled.', 'sucesso');
    carregar();
  } catch (err) {
    mostrarMensagem(msg, err.message, 'erro');
  }
}

carregar();
</script>
