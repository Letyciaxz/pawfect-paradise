<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | Pawfect Paradise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-emoji">🐾</span>
      <span class="logo-text"><strong>Pawfect <span class="brand-pink">Paradise</span></strong><small>cute stuff for cute pets</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html" id="link-admin" style="display:none;">Admin</a>
    </nav>
    <div class="header-icons">
      <a href="shop.html" class="icon-btn" title="Search">🔍</a>
      <a href="perfil.html" class="icon-btn" id="link-usuario" title="Profile">👤</a>
      <a href="carrinho.html" class="icon-btn">🛒<span class="cart-count">0</span></a>
      <button class="menu-toggle" aria-label="Open menu">☰</button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <h1>Your Cart</h1>
    <p class="breadcrumb">Home / Cart</p>
  </div>
</div>

<main class="container secao" style="padding-top:0;">
  <div class="mensagem" id="mensagem-carrinho"></div>
  <div class="carrinho-layout">
    <div class="carrinho-lista" id="lista-carrinho"></div>
    <div class="carrinho-resumo">
      <div class="resumo-pedido">
        <h3>Order Summary</h3>
        <div class="resumo-linha"><span>Subtotal</span><span id="resumo-subtotal">$ 0.00</span></div>
        <div class="resumo-linha"><span>Shipping</span><span id="resumo-frete">Free</span></div>
        <div class="resumo-linha total"><span>Total</span><span id="resumo-total">$ 0.00</span></div>
        <button class="btn btn-primary" id="btn-finalizar" style="width:100%; justify-content:center; margin-top:16px;">Checkout</button>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">&copy; 2026 Pawfect Paradise. All rights reserved. Academic project by Pawfect Dev Team.</div>
</footer>

<script src="app.js"></script>
<script>
let produtosCache = {};

async function carregarCarrinho() {
  const carrinho = obterCarrinho();
  const lista = document.querySelector('#lista-carrinho');

  if (carrinho.length === 0) {
    lista.innerHTML = `<div class="empty-state"><div class="emoji">🛒</div><p>Your cart is empty.</p><a href="shop.html" class="btn btn-primary" style="margin-top:12px;">Start Shopping</a></div>`;
    document.querySelector('#btn-finalizar').disabled = true;
    atualizarResumo(0);
    return;
  }

  const produtos = await Promise.all(carrinho.map((item) => get('/produtos/' + item.produto_id)));
  produtosCache = Object.fromEntries(produtos.map((p) => [p.id, p]));

  lista.innerHTML = carrinho.map((item) => {
    const p = produtosCache[item.produto_id];
    if (!p) return '';
    return `
      <div class="carrinho-item">
        <img src="${p.imagem}" alt="${p.nome}">
        <div class="info">
          <strong>${p.nome}</strong>
          <p style="margin:4px 0;">${formatarPreco(p.preco)}</p>
        </div>
        <div class="qtd-control">
          <button onclick="mudarQtd(${p.id}, ${item.quantidade - 1})">-</button>
          <span>${item.quantidade}</span>
          <button onclick="mudarQtd(${p.id}, ${item.quantidade + 1})">+</button>
        </div>
        <strong>${formatarPreco(p.preco * item.quantidade)}</strong>
        <button class="btn btn-danger btn-small" onclick="removerItem(${p.id})">Remove</button>
      </div>
    `;
  }).join('');

  const subtotal = carrinho.reduce((soma, item) => soma + (produtosCache[item.produto_id]?.preco || 0) * item.quantidade, 0);
  atualizarResumo(subtotal);
  document.querySelector('#btn-finalizar').disabled = false;
}

function atualizarResumo(subtotal) {
  document.querySelector('#resumo-subtotal').textContent = formatarPreco(subtotal);
  document.querySelector('#resumo-total').textContent = formatarPreco(subtotal);
}

function mudarQtd(produtoId, novaQtd) {
  atualizarQuantidadeCarrinho(produtoId, novaQtd);
  carregarCarrinho();
}

function removerItem(produtoId) {
  removerDoCarrinho(produtoId);
  carregarCarrinho();
}

document.querySelector('#btn-finalizar').addEventListener('click', async () => {
  const msg = document.querySelector('#mensagem-carrinho');
  const carrinho = obterCarrinho();
  if (!carrinho.length) {
    mostrarMensagem(msg, 'Your cart is empty. Add some products before checkout.', 'erro');
    return;
  }

  const itens = carrinho.map((item) => {
    const produto = produtosCache[item.produto_id];
    return {
      quantidade: item.quantidade,
      preco: produto.preco,
      produto_nome: produto.nome,
      produto_imagem: produto.imagem,
    };
  });

  const valorTotal = itens.reduce((total, item) => total + item.preco * item.quantidade, 0);
  const pedidos = JSON.parse(localStorage.getItem('pawfect_pedidos') || '[]');
  const pedido = {
    id: Date.now(),
    data: new Date().toISOString(),
    status: 'Pending',
    valor_total: valorTotal,
    itens,
    usuario_id: 0,
  };
  pedidos.unshift(pedido);
  localStorage.setItem('pawfect_pedidos', JSON.stringify(pedidos));
  limparCarrinho();
  mostrarMensagem(msg, `Order #${pedido.id} placed successfully! Total: ${formatarPreco(valorTotal)}`, 'sucesso');
  setTimeout(() => navegarComTransicao('meus-pedidos.html'), 1200);
});

carregarCarrinho();
</script>
</body>
</html>
